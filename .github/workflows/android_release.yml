name: android-build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        # v4 installs only platform-tools; Gradle downloads the platform and
        # build-tools it needs.
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Decode Keystore
        uses: timheuer/base64-to-file@v2
        with:
          fileName: 'xwallet.keystore'
          fileDir: './android/app/'
          encodedString: ${{ secrets.ANDROID_SIGNING_KEY }}

      - name: Create .env file
        run: |
          echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}" >> .env
          echo "WALLETCONNECT_PROJECT_ID=${{ secrets.WALLETCONNECT_PROJECT_ID }}" >> .env
          echo "WALLETCONNECT_PROJECT_RELAY=${{ secrets.WALLETCONNECT_PROJECT_RELAY }}" >> .env

      - name: Build Android AAB Release
        run: cd android && ./gradlew bundleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}

      - name: Build Android APK Release
        run: cd android && ./gradlew assembleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # Tag builds only: publish a GitHub Release with the signed APK and AAB.
      # Release notes come from .github/release-notes/<tag>.md when that file
      # exists, otherwise from the merged pull requests since the last tag.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/eckoWALLET-$TAG.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release/eckoWALLET-$TAG.aab"
          (cd release && sha256sum eckoWALLET-* > SHA256SUMS.txt)
          NOTES_FILE=".github/release-notes/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" release/* --verify-tag --title "eckoWALLET $TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" release/* --verify-tag --title "eckoWALLET $TAG" --generate-notes
          fi
