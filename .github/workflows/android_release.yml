name: android-build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Read-only by default. Only the publish job below gets write access.
permissions:
  contents: read

# Only GitHub-owned actions (actions/*), each pinned to a full commit SHA so a
# moved tag cannot change what runs. Everything else is a plain shell step.
jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Same check the Gradle wrapper-validation action did: the committed
      # gradle-wrapper.jar must match the checksum Gradle publishes for the
      # version in gradle-wrapper.properties.
      - name: Verify Gradle wrapper
        run: |
          GRADLE_VERSION=$(sed -n 's/^distributionUrl=.*gradle-\(.*\)-bin\.zip$/\1/p' android/gradle/wrapper/gradle-wrapper.properties)
          EXPECTED=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-wrapper.jar.sha256")
          echo "Gradle ${GRADLE_VERSION}, expected wrapper sha256 ${EXPECTED}"
          echo "${EXPECTED}  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      # The runner image ships the Android SDK and Google's sdkmanager.
      # Accept the licenses and install the packages build.gradle pins;
      # Gradle downloads anything else it needs (e.g. the NDK).
      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          "$SDKMANAGER" --list_installed | grep -E "platform-tools|platforms;android-36|build-tools;36.0.0"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Decode keystore
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > android/app/xwallet.keystore
          test -s android/app/xwallet.keystore

      # ENCRYPTION_KEY is the MMKV key of existing wallets. A missing or
      # different value makes them unreadable after the update, so fail
      # instead of building with an empty key. The fingerprint (first 12 hex
      # of its sha256) can be compared across builds without exposing it.
      - name: Create .env file
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          WALLETCONNECT_PROJECT_RELAY: ${{ secrets.WALLETCONNECT_PROJECT_RELAY }}
        run: |
          if [ -z "$ENCRYPTION_KEY" ]; then
            echo "::error::The ENCRYPTION_KEY secret is empty."
            exit 1
          fi
          echo "ENCRYPTION_KEY fingerprint (sha256, first 12 hex): $(printf '%s' "$ENCRYPTION_KEY" | sha256sum | cut -c1-12)"
          {
            printf 'ENCRYPTION_KEY=%s\n' "$ENCRYPTION_KEY"
            printf 'WALLETCONNECT_PROJECT_ID=%s\n' "$WALLETCONNECT_PROJECT_ID"
            printf 'WALLETCONNECT_PROJECT_RELAY=%s\n' "$WALLETCONNECT_PROJECT_RELAY"
          } > .env

      - name: Build Android AAB Release
        run: cd android && ./gradlew bundleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}

      - name: Build Android APK Release
        run: cd android && ./gradlew assembleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}

      - name: Verify signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          # jarsigner exits 0 even for an unsigned file, so require its verdict.
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | grep -x "jar verified."

      - name: Collect release files
        env:
          NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}-{1}', github.ref_name, github.run_number) }}
        run: |
          mkdir -p release
          SAFE_NAME=$(printf '%s' "$NAME" | tr '/' '-')
          cp android/app/build/outputs/apk/release/app-release.apk "release/eckoWALLET-$SAFE_NAME.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release/eckoWALLET-$SAFE_NAME.aab"
          (cd release && sha256sum eckoWALLET-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          rm -f android/app/xwallet.keystore .env

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: release/
          if-no-files-found: error

  # Tag builds only: publish a GitHub Release with the signed APK and AAB.
  # This job never sees the signing key or app secrets; it only gets the
  # built files and the token needed to create the release.
  # Release notes come from .github/release-notes/<tag>.md when that file
  # exists, otherwise from the merged pull requests since the last tag.
  publish-release:
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum -c SHA256SUMS.txt)
          NOTES_FILE=".github/release-notes/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" release/* --verify-tag --title "eckoWALLET $TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" release/* --verify-tag --title "eckoWALLET $TAG" --generate-notes
          fi
